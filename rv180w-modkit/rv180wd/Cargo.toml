[package]
name = "rv180wd"
version = "3.0.0-alpha"
edition = "2021"
description = "Cisco RV180W next-gen pure Rust control plane daemon (rv180w-next)"

[[bin]]
name = "rv180wd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
